name: Validate MSIX packaging

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: Build and inspect unsigned x64 and ARM64 bundle
        run: ./scripts/Build-MSIX.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: WSAppBak-unsigned-MSIX-validation
          path: |
            artifacts/msix/**/*.msixbundle
            artifacts/msix/**/Dependencies/**/*
          if-no-files-found: error
