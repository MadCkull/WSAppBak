name: Prepare WSAppBak release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version matching the manifest (for example v2.0.1)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Validate release version
      env:
        REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
      run: |
        if ($env:REQUESTED_VERSION -notmatch '^v(\d+)\.(\d+)\.(\d+)$') { throw 'Use a version such as v2.0.1.' }
        $version = $env:REQUESTED_VERSION.Substring(1)
        [xml]$manifest = Get-Content 'WSAppBak/WSAppBak (Package)/Package.appxmanifest'
        [xml]$project = Get-Content 'WSAppBak/WSAppBak/WSAppBak.csproj'
        if ($manifest.Package.Identity.Version -ne "$version.0") { throw 'Release and MSIX manifest versions differ.' }
        if ($project.Project.PropertyGroup.Version -notcontains $version) { throw 'Release and application versions differ.' }
        if (!(Test-Path "docs/release-notes/$env:REQUESTED_VERSION.md")) { throw 'Release notes are missing.' }
        "RELEASE_TAG=$env:REQUESTED_VERSION" >> $env:GITHUB_ENV

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Decode Signing Certificate
      env:
        CERTIFICATE_BASE64: ${{ secrets.APP_CERTIFICATE_BASE64 }}
      run: |
        $pfx_cert_byte = [System.Convert]::FromBase64String($env:CERTIFICATE_BASE64)
        [IO.File]::WriteAllBytes("WSAppBak\WSAppBak (Package)\WSAppBak_SelfSigned.pfx", $pfx_cert_byte)

    - name: Build MSIX Bundle
      env:
        WSAPPBAK_CERTIFICATE_PASSWORD: ${{ secrets.APP_CERTIFICATE_PASSWORD }}
      run: ./scripts/Build-MSIX.ps1 -OutputRoot "${{ github.workspace }}\AppxPackages" -CertificatePath "WSAppBak\WSAppBak (Package)\WSAppBak_SelfSigned.pfx"

    - name: Build Portable ZIP (Unpackaged)
      run: |
        $tagName = $env:RELEASE_TAG
        $portableZipName = "WSAppBak $tagName (Portable - x64).zip"
        ./scripts/Build-Portable.ps1 -Version $tagName -OutputRoot "${{ github.workspace }}" -SmokeTest
        echo "PORTABLE_ZIP=$portableZipName" >> $env:GITHUB_ENV

    - name: Prepare Installer ZIP
      run: |
        $tagName = $env:RELEASE_TAG
        $msixName = "WSAppBak ${tagName}.msixbundle"
        $installerZipName = "WSAppBak $tagName (x64-ARM64).zip"
        
        # Create staging directory
        $stagingDir = "${{ github.workspace }}\InstallerStaging"
        New-Item -ItemType Directory -Path $stagingDir
        
        # Move and rename MSIX
        $bundles = @(Get-ChildItem -Path "${{ github.workspace }}\AppxPackages" -Filter *.msixbundle -Recurse)
        if ($bundles.Count -ne 1) { throw 'Expected exactly one validated MSIX bundle.' }
        $msix = $bundles[0]
        Copy-Item -Path $msix.FullName -Destination "$stagingDir\$msixName"
        Copy-Item -LiteralPath (Join-Path $msix.DirectoryName 'Dependencies') -Destination "$stagingDir\Dependencies" -Recurse
        Copy-Item -LiteralPath 'scripts\Install-MSIX.ps1' -Destination "$stagingDir\Install.ps1"
        
        # Copy Certificate
        $signature = Get-AuthenticodeSignature -LiteralPath $msix.FullName
        if (!$signature.SignerCertificate) { throw 'The release bundle must be signed.' }
        [IO.File]::WriteAllBytes("$stagingDir\WSAppBak Certificate.cer", $signature.SignerCertificate.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))
        
        # Create Install Instructions
        $instructions = @"
        HOW TO INSTALL WSAppBak

        1. Double-click the 'WSAppBak Certificate.cer' file.
        2. Click 'Install Certificate...'.
        3. Select 'Local Machine' and click Next.
        4. Select 'Place all certificates in the following store' and click 'Browse'.
        5. Choose 'Trusted People' and click OK, then Next, then Finish.
        6. Right-click 'Install.ps1' and choose 'Run with PowerShell' to install the
           bundle and the included dependencies for your PC's architecture.
           Run this step as your normal Windows user.
        "@
        Set-Content -Path "$stagingDir\Install Instructions.txt" -Value $instructions
        
        # Create ZIP
        Compress-Archive -Path "$stagingDir\*" -DestinationPath "${{ github.workspace }}\$installerZipName"
        
        echo "INSTALLER_ZIP=$installerZipName" >> $env:GITHUB_ENV

    - name: Record release checksums
      run: |
        @($env:PORTABLE_ZIP, $env:INSTALLER_ZIP) | ForEach-Object {
          $hash = Get-FileHash -LiteralPath $_ -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_))"
        } | Set-Content SHA256SUMS.txt

    - name: Save release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WSAppBak-${{ env.RELEASE_TAG }}-release
        path: |
          ${{ env.PORTABLE_ZIP }}
          ${{ env.INSTALLER_ZIP }}
          SHA256SUMS.txt
        if-no-files-found: error

    - name: Prepare draft GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        target_commitish: ${{ github.sha }}
        name: WSAppBak ${{ env.RELEASE_TAG }}
        draft: true
        body_path: docs/release-notes/${{ env.RELEASE_TAG }}.md
        fail_on_unmatched_files: true
        files: |
          ${{ env.PORTABLE_ZIP }}
          ${{ env.INSTALLER_ZIP }}
          SHA256SUMS.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
