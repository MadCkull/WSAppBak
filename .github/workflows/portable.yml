name: Validate portable build

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: Build and test extracted portable ZIP
        run: ./scripts/Build-Portable.ps1 -Version ci -SmokeTest
      - uses: actions/upload-artifact@v4
        with:
          name: WSAppBak-portable-x64
          path: artifacts/portable/*.zip
          if-no-files-found: error
