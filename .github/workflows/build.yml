name: Build WSAppBak

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 6.0.x

    - name: Restore dependencies
      run: dotnet restore WSAppBak/WSAppBak.sln

    - name: Build
      run: dotnet build WSAppBak/WSAppBak.sln --configuration Release --no-restore
